name: Prepare Release PR

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "run this workflow from main; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Derive next release metadata
        id: meta
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [ -z "${latest_tag}" ]; then
            echo "no existing release tag found; bootstrap the first release manually before using this workflow" >&2
            exit 1
          fi

          current_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); pkg = next(p for p in data["packages"] if p["name"] == "loftr"); print(pkg["version"])')"
          latest_version="${latest_tag#v}"
          if [ "${current_version}" != "${latest_version}" ]; then
            echo "workspace version ${current_version} does not match latest release tag ${latest_tag}; finish that release before preparing another one" >&2
            exit 1
          fi

          commit_count="$(git rev-list --count --no-merges "${latest_tag}..HEAD")"
          if [ "${commit_count}" = "0" ]; then
            echo "no commits since ${latest_tag}; nothing to release" >&2
            exit 1
          fi

          mkdir -p target
          git log --no-merges --format='%s%x1f%b%x1e' "${latest_tag}..HEAD" > target/release-commits.txt

          export CURRENT_VERSION="${current_version}"
          export COMMITS_FILE="target/release-commits.txt"
          next_version="$(python3 - <<'PY'
          import os
          import re

          major, minor, patch = map(int, os.environ["CURRENT_VERSION"].split("."))
          with open(os.environ["COMMITS_FILE"], "r", encoding="utf-8") as handle:
              records = [record for record in handle.read().split("\x1e") if record.strip()]

          breaking = False
          has_feat = False
          for record in records:
              subject, body = (record.split("\x1f", 1) + [""])[:2]
              subject = subject.strip()
              body = body.strip()
              if re.match(r"^[a-z]+(?:\([^)]+\))?!:", subject) or "BREAKING CHANGE:" in body or "BREAKING-CHANGE:" in body:
                  breaking = True
              if re.match(r"^feat(?:\([^)]+\))?:", subject):
                  has_feat = True

          if breaking:
              print(f"{major + 1}.0.0")
          elif has_feat:
              print(f"{major}.{minor + 1}.0")
          else:
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          tag="v${next_version}"
          branch="release/${tag}"
          title="chore(release): prepare ${tag}"
          echo "latest_tag=${latest_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "title=${title}" >> "${GITHUB_OUTPUT}"

      - name: Bump workspace version
        env:
          NEXT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("Cargo.toml")
          lines = path.read_text(encoding="utf-8").splitlines()
          in_workspace_package = False
          updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[workspace.package]":
                  in_workspace_package = True
                  continue
              if in_workspace_package and stripped.startswith("[") and stripped.endswith("]"):
                  break
              if in_workspace_package and stripped.startswith("version = "):
                  lines[index] = f'version = "{os.environ["NEXT_VERSION"]}"'
                  updated = True
                  break

          if not updated:
              raise SystemExit("failed to locate workspace.package version in Cargo.toml")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --verbose
            --unreleased
            --tag ${{ steps.meta.outputs.tag }}
            --strip header
        env:
          OUTPUT: target/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag ${{ steps.meta.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Write pull request body
        env:
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Summary"
            echo "- bump workspace version to ${VERSION}"
            echo "- update CHANGELOG.md for ${TAG}"
            echo "- merging this PR will automatically publish ${TAG} and create the git tag and GitHub release"
            echo
            echo "## Maintainer Notes"
            echo "- this PR was generated from \`${LATEST_TAG}..main\` using conventional commits"
            echo "- if new commits land on \`main\` before merge, rerun this workflow so the release PR stays current"
            echo
            cat target/release-notes.md
          } > target/release-pr-body.md

      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh label list --repo "${{ github.repository }}" --limit 200 --json name --jq '.[].name' | grep -Fx "release:automated" >/dev/null; then
            gh label create "release:automated" \
              --repo "${{ github.repository }}" \
              --color "0E8A16" \
              --description "Workflow-managed release preparation PR"
          fi

      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: |
            Cargo.toml
            CHANGELOG.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          body-path: target/release-pr-body.md
          branch: ${{ steps.meta.outputs.branch }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.meta.outputs.title }}
          delete-branch: false
          labels: |
            release:automated
          title: ${{ steps.meta.outputs.title }}
