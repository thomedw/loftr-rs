name: Prepare Release PR

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "run this workflow from main; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Recover unfinished releases and derive next release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_workflow.py prepare \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"

      - name: Bump workspace version
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        env:
          NEXT_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("Cargo.toml")
          lines = path.read_text(encoding="utf-8").splitlines()
          in_workspace_package = False
          updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[workspace.package]":
                  in_workspace_package = True
                  continue
              if in_workspace_package and stripped.startswith("[") and stripped.endswith("]"):
                  break
              if in_workspace_package and stripped.startswith("version = "):
                  lines[index] = f'version = "{os.environ["NEXT_VERSION"]}"'
                  updated = True
                  break

          if not updated:
              raise SystemExit("failed to locate workspace.package version in Cargo.toml")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate release notes
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --verbose
            --unreleased
            --tag ${{ steps.prepare.outputs.tag }}
            --strip header
        env:
          OUTPUT: target/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update changelog
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag ${{ steps.prepare.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Write pull request body
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        env:
          LATEST_TAG: ${{ steps.prepare.outputs.latest_tag }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Summary"
            echo "- bump workspace version to ${VERSION}"
            echo "- update CHANGELOG.md for ${TAG}"
            echo "- merging this PR will automatically publish ${TAG} and create the git tag and GitHub release"
            echo
            echo "## Maintainer Notes"
            echo "- this PR was generated from \`${LATEST_TAG}..main\` using conventional commits"
            echo "- if new commits land on \`main\` before merge, rerun this workflow so the release PR stays current"
            echo
            cat target/release-notes.md
          } > target/release-pr-body.md

      - name: Ensure release label exists
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh label list --repo "${{ github.repository }}" --limit 200 --json name --jq '.[].name' | grep -Fx "release:automated" >/dev/null; then
            gh label create "release:automated" \
              --repo "${{ github.repository }}" \
              --color "0E8A16" \
              --description "Workflow-managed release preparation PR"
          fi

      - name: Create or update release PR
        if: ${{ steps.prepare.outputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: |
            Cargo.toml
            CHANGELOG.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          body-path: target/release-pr-body.md
          branch: ${{ steps.prepare.outputs.branch }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.prepare.outputs.title }}
          delete-branch: false
          labels: |
            release:automated
          title: ${{ steps.prepare.outputs.title }}
