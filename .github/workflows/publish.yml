name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Crate version to release, for example 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Generate notes and verify publish without pushing a tag or GitHub release"
        required: true
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "run this workflow from main; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Derive release metadata
        id: meta
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="v${version}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); pkg = next(p for p in data["packages"] if p["name"] == "loftr"); print(pkg["version"])')"
          if [ "${crate_version}" != "${version}" ]; then
            echo "workflow version ${version} does not match crate version ${crate_version}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists locally" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists on origin" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "title=loftr ${tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --verbose
            --unreleased
            --tag ${{ steps.meta.outputs.tag }}
            --strip header
        env:
          OUTPUT: target/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update changelog
        run: python3 scripts/update_changelog.py CHANGELOG.md target/release-notes.md

      - name: Add release notes to summary
        run: |
          {
            echo "## ${{ steps.meta.outputs.title }}"
            echo
            cat target/release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure git author
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changelog
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${{ steps.meta.outputs.tag }}"

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run -p loftr --locked --features download-libtorch
          else
            cargo publish -p loftr --locked --features download-libtorch
          fi

      - name: Create annotated tag
        if: ${{ !inputs.dry_run }}
        run: git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --verify-tag \
            --latest \
            --fail-on-no-commits \
            -F target/release-notes.md
