name: Publish Release

on:
  pull_request_target:
    types:
      - closed

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'release:automated')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Derive release metadata
        id: meta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); pkg = next(p for p in data["packages"] if p["name"] == "loftr"); print(pkg["version"])')"
          tag="v${version}"
          expected_branch="release/${tag}"
          if [ "${HEAD_REF}" != "${expected_branch}" ]; then
            echo "release branch ${HEAD_REF} does not match crate version ${version}; expected ${expected_branch}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "title=loftr ${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if curl -fsS "https://crates.io/api/v1/crates/loftr/${{ steps.meta.outputs.version }}" >/dev/null; then
            echo "crate_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "crate_published=false" >> "${GITHUB_OUTPUT}"
          fi
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "github_release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "github_release_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Extract release notes from changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(tag)}\][^\n]*\n.*?(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(f"failed to find release notes for {tag} in CHANGELOG.md")

          Path("target").mkdir(exist_ok=True)
          Path("target/release-notes.md").write_text(
              match.group(0).strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Add release notes to summary
        run: |
          {
            echo "## ${{ steps.meta.outputs.title }}"
            echo
            cat target/release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate to crates.io via trusted publishing
        if: ${{ steps.state.outputs.crate_published != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ steps.state.outputs.crate_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p loftr --locked --features download-libtorch

      - name: Create annotated tag
        if: ${{ steps.meta.outputs.tag_exists != 'true' }}
        run: git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"

      - name: Push release tag
        if: ${{ steps.meta.outputs.tag_exists != 'true' }}
        run: git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ steps.state.outputs.github_release_exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --verify-tag \
            --latest \
            -F target/release-notes.md
