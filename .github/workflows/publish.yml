name: Publish Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Publish Release Recovery v{0}', inputs.expected_version) ||
    'Publish Release'
  }}

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Release version to publish or repair, without the leading v.
        required: true
        type: string
      source_ref:
        description: Commit SHA on main to publish from.
        required: true
        type: string
      caller_run_id:
        description: Prepare Release PR run id that dispatched this recovery.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - CHANGELOG.md

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Derive publish context
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_workflow.py publish-context \
            --event-name "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --expected-version "${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '' }}" \
            --source-ref "${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}"

      - name: Extract release notes
        if: ${{ steps.release.outputs.release_pr == 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/release_workflow.py extract-release-notes \
            --tag "${{ steps.release.outputs.tag }}" \
            --input CHANGELOG.md \
            --output target/release-notes.md

      - name: Add release notes to summary
        if: ${{ steps.release.outputs.release_pr == 'true' }}
        run: |
          {
            echo "## ${{ steps.release.outputs.title }}"
            echo
            cat target/release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate to crates.io via trusted publishing
        if: ${{ steps.release.outputs.release_pr == 'true' && steps.release.outputs.crate_published != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ steps.release.outputs.release_pr == 'true' && steps.release.outputs.crate_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p loftr --features download-libtorch

      - name: Create annotated tag
        if: ${{ steps.release.outputs.release_pr == 'true' && steps.release.outputs.tag_exists != 'true' }}
        run: git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"

      - name: Push release tag
        if: ${{ steps.release.outputs.release_pr == 'true' && steps.release.outputs.tag_exists != 'true' }}
        run: git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: ${{ steps.release.outputs.release_pr == 'true' && steps.release.outputs.github_release_exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release.outputs.title }}" \
            --verify-tag \
            --latest \
            -F target/release-notes.md
