name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/prepare_test_fixtures.sh
      - run: cargo test --workspace --features download-libtorch

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/prepare_test_fixtures.sh
      - run: |
          ./scripts/validate_loftr_against_kornia.sh \
            crates/loftr/tests/data/kn_church-2.jpg \
            crates/loftr/tests/data/kn_church-8.jpg \
            crates/loftr/tests/data/loftr_outdoor_state_dict.safetensors \
            target/loftr_validation

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/prepare_test_fixtures.sh
      - name: Generate coverage and enforce threshold
        run: |
          mkdir -p target/llvm-cov
          set +e
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --features download-libtorch --fail-under-lines 80 \
            | tee target/llvm-cov/summary.txt
          status=${PIPESTATUS[0]}
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/coverage.json || true
          cargo llvm-cov report --html --output-dir target/llvm-cov/html || true
          exit "${status}"
      - name: Add coverage summary
        if: always()
        run: |
          if [ -f target/llvm-cov/summary.txt ]; then
            {
              echo "## Coverage"
              echo
              echo '```text'
              cat target/llvm-cov/summary.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          if-no-files-found: warn
          path: |
            target/llvm-cov/summary.txt
            target/llvm-cov/coverage.json
            target/llvm-cov/html

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo publish --dry-run -p loftr --features download-libtorch
